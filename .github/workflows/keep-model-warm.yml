name: Keep-warm canary

# SECONDARY. The primary keep-warm is the Cloudflare Cron Trigger in
# workers/keepwarm, which fires every 10 minutes and actually keeps to its
# schedule. This job exists as an independent canary: it checks from outside
# Cloudflare that retinaoct.com can still reach and wake the model, and goes
# red when it cannot.
#
# Do not rely on this one for warmth. GitHub treats schedules as best-effort
# and throttles frequent ones hard — asked for every 15 minutes, this repo's
# run history delivered every 4-8 hours, which is how the model came to be
# cold all day while the job reported success.
#
# It asks ?debug=1 so it asserts on what HuggingFace returned, not on what our
# own endpoint says. The earlier version checked only that /api/warm answered,
# which it always does, so it was green for days while every poke was being
# refused in 0.18s with no User-Agent.
#
# Note: GitHub disables scheduled workflows in a public repository after 60
# days with no commits.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:        # so it can be triggered by hand from the Actions tab

permissions: {}             # needs nothing from the repository

concurrency:
  group: keep-warm-canary
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poke the model
        run: |
          # ?debug=1 waits for the upstream response and reports it. Without
          # this the job went green for days while doing nothing: /api/warm
          # answers 200 regardless of whether the model was actually reached.
          curl -sS -o /tmp/warm.json -w 'HTTP %{http_code}\n' \
            --max-time 180 --retry 2 --retry-delay 15 \
            "https://retinaoct.com/api/warm?debug=1&src=cron"
          cat /tmp/warm.json; echo
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/warm.json"))
          status, err = d.get("status"), d.get("err")
          if err:
              sys.exit(f"::error::warm fetch raised {err}")
          if status != 200:
              # A fast 503 is the signature of a request HuggingFace declined
              # to treat as a page load, so it never started the container.
              sys.exit(f"::error::upstream returned {status} after "
                       f"{d.get('elapsed_ms')}ms - the model was not woken")
          print(f"model reached: {status} in {d.get('elapsed_ms')}ms")
          PY
