name: Keep the model warm

# The HuggingFace Space sleeps when idle, and waking it costs the first
# visitor somewhere between 44 seconds and seven minutes. This pokes it often
# enough that it never goes idle.
#
# It calls retinaoct.com/api/warm rather than the Space directly, so no
# HuggingFace token is needed here: the Pages Function already holds one. That
# keeps the credential in exactly one place.
#
# Costs no GPU quota. ZeroGPU only allocates a GPU inside the handler's
# @spaces.GPU call, and /api/warm asks for the Space root, which never reaches
# one.
#
# On the interval. The Space reports a 48-hour idle timeout, but it was
# observed asleep under two hours after its last use, so the reported figure
# cannot be relied on, and HuggingFace does not document a real one for
# ZeroGPU. Fifteen minutes is deliberately well inside any plausible timeout:
# it leaves room for GitHub's scheduled runs, which are best-effort and are
# often several minutes late and occasionally skipped under load, so even a
# couple of consecutive misses stay harmless.
#
# This is cheap to run but not free to HuggingFace -- it holds a CPU container
# slot continuously. Do not shorten it further without a reason; if the model
# is somehow still found asleep, the interval is not the problem and the
# question is whether /api/warm resets the idle timer at all.
#
# Note: GitHub disables scheduled workflows in a public repository after 60
# days with no commits. If analysis starts cold-starting again months from
# now, check that this workflow is still enabled before anything else.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:        # so it can be triggered by hand from the Actions tab

permissions: {}             # needs nothing from the repository

concurrency:
  group: keep-model-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poke the model
        run: |
          # ?debug=1 waits for the upstream response and reports it. Without
          # this the job went green for days while doing nothing: /api/warm
          # answers 200 regardless of whether the model was actually reached.
          curl -sS -o /tmp/warm.json -w 'HTTP %{http_code}\n' \
            --max-time 180 --retry 2 --retry-delay 15 \
            "https://retinaoct.com/api/warm?debug=1&src=cron"
          cat /tmp/warm.json; echo
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/warm.json"))
          status, err = d.get("status"), d.get("err")
          if err:
              sys.exit(f"::error::warm fetch raised {err}")
          if status != 200:
              # A fast 503 is the signature of a request HuggingFace declined
              # to treat as a page load, so it never started the container.
              sys.exit(f"::error::upstream returned {status} after "
                       f"{d.get('elapsed_ms')}ms - the model was not woken")
          print(f"model reached: {status} in {d.get('elapsed_ms')}ms")
          PY
